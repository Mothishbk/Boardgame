# Pinned CLI tool versions live here — bump in ONE place.
# Every scanner produces BOTH:
#   * a SARIF file -> uploaded to GitHub Security (Code scanning), unique category
#   * its native report (JSON/HTML/CSV/SARIF) -> uploaded as a downloadable artifact
name: Java-project-Vulnerable

on:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write  # required to upload SARIF to the Security tab

env:
  APP_NAME: Vuln Project
  PROJECT_DIR: Boardgame-main
  GITLEAKS_VERSION: "8.21.2"     # pinned
  TRIVY_VERSION: "0.58.1"        # pinned
  DC_VERSION: "10.0.4"           # pinned (OWASP Dependency-Check)

jobs:
  build:
    name: Initiate the App deployment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Boardgame-main

    steps:
      - name: Code Checkout Step
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ---------- 1) Secret scanning (early, no build needed) ----------
      - name: Install Gitleaks (pinned + checksum)
        working-directory: .
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL --retry 3 -o "$f" "$url/$f"
          curl -fsSL --retry 3 -o gitleaks_checksums.txt "$url/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $f\$" gitleaks_checksums.txt | sha256sum -c -
          mkdir -p gitleaksbin && tar -xzf "$f" -C gitleaksbin
          sudo mv gitleaksbin/gitleaks /usr/local/bin/
          gitleaks version

      # Gitleaks: one run makes CSV (readable) + SARIF (Security tab)
      - name: Code Security check (Gitleaks)
        working-directory: .
        run: |
          gitleaks detect --no-git --source . --redact --exit-code 0 \
            --report-format csv   --report-path Boardgame-main/gitleaks-report.csv
          gitleaks detect --no-git --source . --redact --exit-code 0 \
            --report-format sarif --report-path Boardgame-main/gitleaks.sarif

      - name: Upload Gitleaks SARIF to Security tab
        if: ${{ !cancelled() && hashFiles('Boardgame-main/gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Boardgame-main/gitleaks.sarif
          category: gitleaks

      - name: Install Trivy (pinned + checksum)
        working-directory: .
        run: |
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSL --retry 3 -o "$f" "$url/$f"
          curl -fsSL --retry 3 -o trivy_checksums.txt "$url/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " $f\$" trivy_checksums.txt | sha256sum -c -
          mkdir -p trivybin && tar -xzf "$f" -C trivybin
          sudo mv trivybin/trivy /usr/local/bin/
          trivy --version

      # Scan ONCE to JSON, then convert the same result to SARIF (no re-scan)
      - name: Trivy secret scan (JSON + SARIF)
        run: |
          trivy fs --scanners secret --offline-scan --skip-files README.md \
            --exit-code 0 --format json --output trivy-secret-report.json .
          trivy convert --format sarif --output trivy-secret.sarif trivy-secret-report.json

      - name: Upload Trivy secret SARIF to Security tab
        if: ${{ !cancelled() && hashFiles('Boardgame-main/trivy-secret.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Boardgame-main/trivy-secret.sarif
          category: trivy-secret

      - name: Upload secret scan reports (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-secrets
          path: |
            Boardgame-main/gitleaks-report.csv
            Boardgame-main/gitleaks.sarif
            Boardgame-main/trivy-secret-report.json
            Boardgame-main/trivy-secret.sarif
          if-no-files-found: warn
          retention-days: 7

      # ---------- 2) Test and build ----------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: Boardgame-main/pom.xml

      - name: Perform Unit Test
        run: mvn -B test

      - name: Build
        run: mvn -B package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-jar
          path: Boardgame-main/target/*.jar
          retention-days: 7

      # ---------- 3) Dependency vulnerability scanning (after build) ----------
      # ~/.m2 is now filled by Maven, so Trivy finds libraries locally
      - name: Trivy vulnerability scan (JSON + SARIF)
        run: |
          trivy fs --scanners vuln --exit-code 0 \
            --format json --output trivy-vuln-report.json .
          trivy convert --format sarif --output trivy-vuln.sarif trivy-vuln-report.json

      - name: Upload Trivy vuln SARIF to Security tab
        if: ${{ !cancelled() && hashFiles('Boardgame-main/trivy-vuln.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Boardgame-main/trivy-vuln.sarif
          category: trivy-vuln

      - name: Upload vulnerability scan reports (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-vuln
          path: |
            Boardgame-main/trivy-vuln-report.json
            Boardgame-main/trivy-vuln.sarif
          if-no-files-found: warn
          retention-days: 7

      # OWASP Dependency-Check (pinned CLI) — one run -> HTML + JSON + SARIF
      - name: Install OWASP Dependency-Check (pinned + checksum)
        working-directory: .
        run: |
          base="https://github.com/dependency-check/DependencyCheck/releases/download/v${DC_VERSION}"
          curl -fsSL --retry 3 -o dependency-check.zip "$base/dependency-check-${DC_VERSION}-release.zip"
          curl -fsSL --retry 3 -o dependency-check.zip.sha256 "$base/dependency-check-${DC_VERSION}-release.zip.sha256"
          echo "$(cat dependency-check.zip.sha256)  dependency-check.zip" | sha256sum -c -
          unzip -q dependency-check.zip -d /opt
          sudo ln -s /opt/dependency-check/bin/dependency-check.sh /usr/local/bin/dependency-check

      - name: OWASP Dependency-Check Scan
        run: |
          dependency-check \
            --project "Boardgame" \
            --scan . \
            --format HTML \
            --format JSON \
            --format SARIF \
            --out reports \
            --exclude "**/reports/**" \
            --nvdApiKey ${{ secrets.NVD_API_KEY }}

      - name: Upload Dependency-Check SARIF to Security tab
        if: ${{ !cancelled() && hashFiles('Boardgame-main/reports/dependency-check-report.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Boardgame-main/reports/dependency-check-report.sarif
          category: dependency-check

      - name: Upload Dependency-Check reports (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: Boardgame-main/reports
          if-no-files-found: warn
          retention-days: 7

      # ---------- 4) Hand-over to the Sonar job ----------
      - name: Upload compiled classes + coverage (for Sonar)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: |
            Boardgame-main/target/classes
            Boardgame-main/target/site/jacoco
          retention-days: 1

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download compiled classes + coverage
        uses: actions/download-artifact@v4
        with:
          name: compiled-classes
          path: Boardgame-main/target

      - name: Check coverage report is present
        run: ls -la Boardgame-main/target/site/jacoco/jacoco.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: Boardgame-main
          args: >
            -Dsonar.java.binaries=target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        id: qg
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 600
          scanMetadataReportFile: Boardgame-main/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Show Quality Gate status
        if: always()
        run: echo "Quality Gate status is ${{ steps.qg.outputs.quality-gate-status }}"

  docker:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: [build, sonarqube]        # only after tests, scans and Quality Gate pass
    defaults:
      run:
        working-directory: Boardgame-main
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/vuln-java-app:${{ github.sha }}

    steps:
      - name: Code Checkout Step       # multi-stage Dockerfile builds from source
        uses: actions/checkout@v5

      - name: Install Trivy (pinned + checksum)
        working-directory: .
        run: |
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSL --retry 3 -o "$f" "$url/$f"
          curl -fsSL --retry 3 -o trivy_checksums.txt "$url/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " $f\$" trivy_checksums.txt | sha256sum -c -
          mkdir -p trivybin && tar -xzf "$f" -C trivybin
          sudo mv trivybin/trivy /usr/local/bin/
          trivy --version

      - name: Docker Build
        run: docker build -t "$IMAGE" .

      # Scan ONCE to JSON, convert to SARIF (both kept)
      - name: Trivy image scan (JSON + SARIF)
        run: |
          trivy image "$IMAGE" --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 0 --format json --output trivy-image-report.json
          trivy convert --format sarif --output trivy-image.sarif trivy-image-report.json

      - name: Upload Trivy image SARIF to Security tab
        if: ${{ !cancelled() && hashFiles('Boardgame-main/trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Boardgame-main/trivy-image.sarif
          category: trivy-image

      - name: Upload image scan reports (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-image
          path: |
            Boardgame-main/trivy-image-report.json
            Boardgame-main/trivy-image.sarif
          if-no-files-found: warn
          retention-days: 7

      - name: Login & Push to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push "$IMAGE"
