# Simple direct installs (apt where possible). No pinned versions / checksums.
# Every scanner produces BOTH a SARIF (-> GitHub Security) and a downloadable artifact.
name: Java-project-Vulnerable

on:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write  # required to upload SARIF to the Security tab

env:
  APP_NAME: Vuln Project
  PROJECT_DIR: Boardgame-main

jobs:
  build:
    name: Initiate the App deployment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Boardgame-main

    steps:
      - name: Code Checkout Step
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ---------- 1) Secret scanning (early, no build needed) ---------
      - name: Install Gitleaks
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gitleaks

      # Gitleaks: one tool, two reports — CSV (readable) + SARIF (Security tab)
      - name: Code Security check (Gitleaks)
        working-directory: .
        run: |
          gitleaks detect --no-git --source . --redact --exit-code 0 \
            --report-format csv   --report-path Boardgame-main/gitleaks-report.csv
          gitleaks detect --no-git --source . --redact --exit-code 0 \
            --report-format sarif --report-path Boardgame-main/gitleaks.sarif

      - name: Upload Gitleaks SARIF to Security tab
        if: ${{ !cancelled() && hashFiles('Boardgame-main/gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Boardgame-main/gitleaks.sarif
          category: gitleaks

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install -y trivy

      # Scan ONCE to JSON, then convert the same result to SARIF (no re-scan)
      - name: Trivy secret scan (JSON + SARIF)
        run: |
          trivy fs --scanners secret --offline-scan --skip-files README.md \
            --exit-code 0 --format json --output trivy-secret-report.json .
          trivy convert --format sarif --output trivy-secret.sarif trivy-secret-report.json

      - name: Upload Trivy secret SARIF to Security tab
        if: ${{ !cancelled() && hashFiles('Boardgame-main/trivy-secret.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Boardgame-main/trivy-secret.sarif
          category: trivy-secret

      - name: Upload secret scan reports (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-secrets
          path: |
            Boardgame-main/gitleaks-report.csv
            Boardgame-main/gitleaks.sarif
            Boardgame-main/trivy-secret-report.json
            Boardgame-main/trivy-secret.sarif
          if-no-files-found: warn
          retention-days: 7

      # ---------- 2) Test and build ----------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: Boardgame-main/pom.xml

      - name: Perform Unit Test
        run: mvn -B test

      - name: Build
        run: mvn -B package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-jar
          path: Boardgame-main/target/*.jar
          retention-days: 7

      # ---------- 3) Dependency vulnerability scanning (after build) ----------
      # ~/.m2 is now filled by Maven, so Trivy finds libraries locally
      - name: Trivy vulnerability scan (JSON + SARIF)
        run: |
          trivy fs --scanners vuln --exit-code 0 \
            --format json --output trivy-vuln-report.json .
          trivy convert --format sarif --output trivy-vuln.sarif trivy-vuln-report.json

      - name: Upload Trivy vuln SARIF to Security tab
        if: ${{ !cancelled() && hashFiles('Boardgame-main/trivy-vuln.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Boardgame-main/trivy-vuln.sarif
          category: trivy-vuln

      - name: Upload vulnerability scan reports (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-vuln
          path: |
            Boardgame-main/trivy-vuln-report.json
            Boardgame-main/trivy-vuln.sarif
          if-no-files-found: warn
          retention-days: 7

      # ---------- 4) Hand-over to the Sonar job ----------
      - name: Upload compiled classes + coverage (for Sonar)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: |
            Boardgame-main/target/classes
            Boardgame-main/target/site/jacoco
          retention-days: 1

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download compiled classes + coverage
        uses: actions/download-artifact@v4
        with:
          name: compiled-classes
          path: Boardgame-main/target

      - name: Check coverage report is present
        run: ls -la Boardgame-main/target/site/jacoco/jacoco.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: Boardgame-main
          args: >
            -Dsonar.java.binaries=target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        id: qg
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 600
          scanMetadataReportFile: Boardgame-main/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Show Quality Gate status
        if: always()
        run: echo "Quality Gate status is ${{ steps.qg.outputs.quality-gate-status }}"

  docker:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: [build, sonarqube]        # only after tests, scans and Quality Gate pass
    defaults:
      run:
        working-directory: Boardgame-main
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/vuln-java-app:${{ github.sha }}

    steps:
      - name: Code Checkout Step       # multi-stage Dockerfile builds from source
        uses: actions/checkout@v5

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install -y trivy

      - name: Docker Build
        run: docker build -t "$IMAGE" .

      # Scan ONCE to JSON, convert to SARIF (both kept)
      - name: Trivy image scan (JSON + SARIF)
        run: |
          trivy image "$IMAGE" --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 0 --format json --output trivy-image-report.json
          trivy convert --format sarif --output trivy-image.sarif trivy-image-report.json

      - name: Upload Trivy image SARIF to Security tab
        if: ${{ !cancelled() && hashFiles('Boardgame-main/trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Boardgame-main/trivy-image.sarif
          category: trivy-image

      - name: Upload image scan reports (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-image
          path: |
            Boardgame-main/trivy-image-report.json
            Boardgame-main/trivy-image.sarif
          if-no-files-found: warn
          retention-days: 7

      - name: Login & Push to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push "$IMAGE"
