name: Java Monitoring project

on:
  push:
    branches:
      - main

env:
  APP_NAME: devopsshack-java-demo
  PROJECT_DIR: Boardgame-main

jobs:
  build:
    name: Build Process
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Boardgame-main

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: Boardgame-main/pom.xml

      - name: Test
        run: mvn -B test

      - name: Build
        run: mvn -B package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-jar
          path: Boardgame-main/target/*.jar
          retention-days: 7

      - name: Upload compiled classes (for Sonar)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: Boardgame-main/target/classes
          retention-days: 1

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download compiled classes
        uses: actions/download-artifact@v4
        with:
          name: compiled-classes
          path: Boardgame-main/target/classes

      # TEMPORARY: remove once Sonar auth works
      - name: Debug Sonar auth
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then echo "SONAR_TOKEN is EMPTY"; exit 1; fi
          if [ -z "$SONAR_HOST_URL" ]; then echo "SONAR_HOST_URL is EMPTY"; exit 1; fi
          echo "--- token check ---"
          curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/authentication/validate"; echo
          echo "--- project check ---"
          curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/components/show?component=Boardgame"; echo

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: Boardgame-main
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        id: qg
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 600
          scanMetadataReportFile: Boardgame-main/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Show Quality Gate status
        if: always()
        run: echo "Quality Gate status is ${{ steps.qg.outputs.quality-gate-status }}"
